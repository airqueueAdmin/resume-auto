name: ai-career-platform

services:
  postgres:
    image: pgvector/pgvector:pg17
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_career}
      POSTGRES_USER: ${POSTGRES_USER:-ai_career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_password}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_career}
      DB_USERNAME: ${POSTGRES_USER:-ai_career}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_password}
      JWT_ISSUER: ${JWT_ISSUER:-ai-career-platform}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?JWT_SECRET_BASE64 must be set in .env}
      DATA_ENCRYPTION_KEY_BASE64: ${DATA_ENCRYPTION_KEY_BASE64:?DATA_ENCRYPTION_KEY_BASE64 must be set in .env}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_VERIFICATION_HMAC_SECRET_BASE64: ${EMAIL_VERIFICATION_HMAC_SECRET_BASE64:?EMAIL_VERIFICATION_HMAC_SECRET_BASE64 must be set in .env}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com/emails}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-false}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Career Note}
      EMAIL_VERIFICATION_RATE_LIMIT_ENABLED: ${EMAIL_VERIFICATION_RATE_LIMIT_ENABLED:-true}
      EMAIL_VERIFICATION_CLIENT_RATE_LIMIT_WINDOW: ${EMAIL_VERIFICATION_CLIENT_RATE_LIMIT_WINDOW:-PT1H}
      EMAIL_VERIFICATION_MAX_CLIENT_REQUESTS: ${EMAIL_VERIFICATION_MAX_CLIENT_REQUESTS:-20}
      EMAIL_VERIFICATION_DELIVERY_RATE_LIMIT_WINDOW: ${EMAIL_VERIFICATION_DELIVERY_RATE_LIMIT_WINDOW:-P1D}
      EMAIL_VERIFICATION_MAX_DELIVERIES: ${EMAIL_VERIFICATION_MAX_DELIVERIES:-400}
      EXTENSION_ALLOWED_ORIGIN_PATTERNS: ${EXTENSION_ALLOWED_ORIGIN_PATTERNS:-chrome-extension://*,http://localhost:5173,http://127.0.0.1:5173}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_RESUME_DRAFT_PROVIDER: ${AI_RESUME_DRAFT_PROVIDER:-gemini}
      AI_RESUME_DRAFT_OLLAMA_FALLBACK_ENABLED: ${AI_RESUME_DRAFT_OLLAMA_FALLBACK_ENABLED:-true}
      AI_RESUME_DRAFT_OLLAMA_TIMEOUT: ${AI_RESUME_DRAFT_OLLAMA_TIMEOUT:-PT300S}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RETRIEVAL_EMBEDDING_PROVIDER: ${RETRIEVAL_EMBEDDING_PROVIDER:-ollama}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_EMBEDDING_DIMENSIONS: ${GEMINI_EMBEDDING_DIMENSIONS:-768}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_CHAT_URL: ${COMPOSE_OLLAMA_CHAT_URL:-http://host.docker.internal:11434/api/chat}
      OLLAMA_EMBEDDING_URL: ${COMPOSE_OLLAMA_EMBEDDING_URL:-http://host.docker.internal:11434/api/embed}
      JOBKOREA_EXPORT_AUDIT_RETENTION_CLEANUP_ENABLED: ${JOBKOREA_EXPORT_AUDIT_RETENTION_CLEANUP_ENABLED:-true}
      JOBKOREA_EXPORT_AUDIT_RETENTION: ${JOBKOREA_EXPORT_AUDIT_RETENTION:-PT720H}
      JOBKOREA_EXPORT_AUDIT_CLEANUP_CRON: ${JOBKOREA_EXPORT_AUDIT_CLEANUP_CRON:-0 0 3 * * *}
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      PORT: ${FRONTEND_CONTAINER_PORT:-80}
      BACKEND_BASE_URL: ${FRONTEND_BACKEND_BASE_URL:-http://backend:8080}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
