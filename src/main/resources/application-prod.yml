spring:
  config:
    activate:
      on-profile: prod
  flyway:
    placeholders:
      data-encryption-key-base64: ${DATA_ENCRYPTION_KEY_BASE64}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never

app:
  security:
    data-encryption:
      key-base64: ${DATA_ENCRYPTION_KEY_BASE64}
