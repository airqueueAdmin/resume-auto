spring:
  application:
    name: ai-career-platform
  profiles:
    default: local
  flyway:
    clean-disabled: true
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    placeholders:
      data-encryption-key-base64: ${DATA_ENCRYPTION_KEY_BASE64:}
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false
  sql:
    init:
      mode: never

server:
  # Render assigns PORT dynamically; SERVER_PORT remains the local/Compose override.
  port: ${PORT:${SERVER_PORT:8080}}

app:
  identity:
    signup:
      terms-version: ${SIGNUP_TERMS_VERSION:2026-10-21}
      privacy-version: ${SIGNUP_PRIVACY_VERSION:2026-10-21}
    email-verification:
      enabled: ${EMAIL_VERIFICATION_ENABLED:true}
      provider: ${EMAIL_PROVIDER:smtp}
      code-ttl: ${EMAIL_VERIFICATION_CODE_TTL:PT5M}
      resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:PT1M}
      max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
      code-hmac-secret-base64: ${EMAIL_VERIFICATION_HMAC_SECRET_BASE64:REDACTED_HISTORY_VALUE}
      resend-api-url: ${RESEND_API_URL:https://api.resend.com/emails}
      resend-api-key: ${RESEND_API_KEY:}
      smtp-host: ${SMTP_HOST:smtp.gmail.com}
      smtp-port: ${SMTP_PORT:587}
      smtp-username: ${SMTP_USERNAME:}
      smtp-password: ${SMTP_PASSWORD:}
      smtp-start-tls-enabled: ${SMTP_STARTTLS_ENABLED:true}
      smtp-ssl-enabled: ${SMTP_SSL_ENABLED:false}
      from-address: ${EMAIL_FROM_ADDRESS:}
      from-name: ${EMAIL_FROM_NAME:Career Note}
      rate-limit:
        enabled: ${EMAIL_VERIFICATION_RATE_LIMIT_ENABLED:true}
        client-window: ${EMAIL_VERIFICATION_CLIENT_RATE_LIMIT_WINDOW:PT1H}
        max-client-requests: ${EMAIL_VERIFICATION_MAX_CLIENT_REQUESTS:20}
        delivery-window: ${EMAIL_VERIFICATION_DELIVERY_RATE_LIMIT_WINDOW:P1D}
        max-deliveries: ${EMAIL_VERIFICATION_MAX_DELIVERIES:400}
  security:
    data-encryption:
      key-base64: ${DATA_ENCRYPTION_KEY_BASE64:}
    jwt:
      issuer: ${JWT_ISSUER:ai-career-platform}
      secret-base64: ${JWT_SECRET_BASE64:REDACTED_HISTORY_VALUE}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P14D}
  ai:
    provider: ${AI_PROVIDER:gemini}
    prompt-version: ${AI_PROMPT_VERSION:job-analysis-v1}
    # Provider request timeout; increase this for cold local Ollama models or large responses.
    timeout: ${AI_TIMEOUT:PT120S}
    max-attempts: ${AI_MAX_ATTEMPTS:2}
    retry-delay: ${AI_RETRY_DELAY:PT0.1S}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1200}
    temperature: ${AI_TEMPERATURE:0.1}
    matching:
      prompt-version: ${AI_MATCH_PROMPT_VERSION:job-match-v1}
      top-k: ${AI_MATCH_TOP_K:8}
      max-context-characters: ${AI_MATCH_MAX_CONTEXT_CHARACTERS:12000}
    resume-draft:
      provider: ${AI_RESUME_DRAFT_PROVIDER:gemini}
      prompt-version: ${AI_RESUME_DRAFT_PROMPT_VERSION:resume-draft-v7}
      top-k: ${AI_RESUME_DRAFT_TOP_K:8}
      max-context-characters: ${AI_RESUME_DRAFT_MAX_CONTEXT_CHARACTERS:30000}
      max-output-tokens: ${AI_RESUME_DRAFT_MAX_OUTPUT_TOKENS:4096}
      gemini-thinking-budget: ${AI_RESUME_DRAFT_GEMINI_THINKING_BUDGET:512}
      max-attempts: ${AI_RESUME_DRAFT_MAX_ATTEMPTS:2}
      ollama-fallback-enabled: ${AI_RESUME_DRAFT_OLLAMA_FALLBACK_ENABLED:true}
      ollama-timeout: ${AI_RESUME_DRAFT_OLLAMA_TIMEOUT:PT300S}
    self-introduction:
      prompt-version: ${AI_SELF_INTRODUCTION_PROMPT_VERSION:self-introduction-v5}
      top-k: ${AI_SELF_INTRODUCTION_TOP_K:8}
      minimum-similarity: ${AI_SELF_INTRODUCTION_MIN_SIMILARITY:0.45}
      max-context-characters: ${AI_SELF_INTRODUCTION_MAX_CONTEXT_CHARACTERS:24000}
      max-output-tokens: ${AI_SELF_INTRODUCTION_MAX_OUTPUT_TOKENS:1800}
      gemini-thinking-budget: ${AI_SELF_INTRODUCTION_GEMINI_THINKING_BUDGET:0}
      ollama-fallback-enabled: ${AI_SELF_INTRODUCTION_OLLAMA_FALLBACK_ENABLED:true}
      max-attempts: ${AI_SELF_INTRODUCTION_MAX_ATTEMPTS:2}
      ollama-timeout: ${AI_SELF_INTRODUCTION_OLLAMA_TIMEOUT:PT300S}
      ollama-max-output-tokens: ${AI_SELF_INTRODUCTION_OLLAMA_MAX_OUTPUT_TOKENS:900}
    openai:
      endpoint: ${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    ollama:
      endpoint: ${OLLAMA_CHAT_URL:http://localhost:11434/api/chat}
      model: ${OLLAMA_MODEL:llama3.1:8b}
  ocr:
    gemini:
      endpoint: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      timeout: ${GEMINI_TIMEOUT:PT90S}
      max-attempts: ${GEMINI_MAX_ATTEMPTS:1}
      retry-delay: ${GEMINI_RETRY_DELAY:PT0.1S}
      max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:4096}
  retrieval:
    embedding:
      provider: ${RETRIEVAL_EMBEDDING_PROVIDER:ollama}
      ollama:
        endpoint: ${OLLAMA_EMBEDDING_URL:http://localhost:11434/api/embed}
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
        dimensions: ${OLLAMA_EMBEDDING_DIMENSIONS:768}
        timeout: ${OLLAMA_EMBEDDING_TIMEOUT:PT30S}
        max-attempts: ${OLLAMA_EMBEDDING_MAX_ATTEMPTS:2}
        retry-delay: ${OLLAMA_EMBEDDING_RETRY_DELAY:PT0.1S}
      gemini:
        endpoint: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
        dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:768}
        timeout: ${GEMINI_EMBEDDING_TIMEOUT:PT30S}
        max-attempts: ${GEMINI_EMBEDDING_MAX_ATTEMPTS:2}
        retry-delay: ${GEMINI_EMBEDDING_RETRY_DELAY:PT0.1S}
  tools:
    approval-ttl: ${TOOL_APPROVAL_TTL:PT5M}
  workflow:
    job-application-context:
      timeout: ${WORKFLOW_JOB_CONTEXT_TIMEOUT:PT5S}
      max-steps: ${WORKFLOW_JOB_CONTEXT_MAX_STEPS:7}
      max-cost-units: ${WORKFLOW_JOB_CONTEXT_MAX_COST_UNITS:7}
  jobkorea:
    export-audit:
      retention-cleanup-enabled: ${JOBKOREA_EXPORT_AUDIT_RETENTION_CLEANUP_ENABLED:true}
      retention: ${JOBKOREA_EXPORT_AUDIT_RETENTION:PT720H}
      cleanup-cron: ${JOBKOREA_EXPORT_AUDIT_CLEANUP_CRON:0 0 3 * * *}
  extension:
    authorization-code-ttl: ${EXTENSION_AUTHORIZATION_CODE_TTL:PT2M}
    allowed-origin-patterns: ${EXTENSION_ALLOWED_ORIGIN_PATTERNS:chrome-extension://*,http://localhost:5173,http://127.0.0.1:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window: ${RATE_LIMIT_WINDOW:PT1M}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: ${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
  info:
    env:
      enabled: false

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:dev}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
