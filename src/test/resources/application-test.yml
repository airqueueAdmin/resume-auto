spring:
  config:
    activate:
      on-profile: test
  flyway:
    placeholders:
      data-encryption-key-base64: ${DATA_ENCRYPTION_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  jpa:
    show-sql: false

app:
  identity:
    email-verification:
      enabled: false
      provider: smtp
      code-hmac-secret-base64: ${EMAIL_VERIFICATION_HMAC_SECRET_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  security:
    data-encryption:
      key-base64: ${DATA_ENCRYPTION_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  ai:
    provider: openai
  rate-limit:
    enabled: false
  jobkorea:
    export-audit:
      retention-cleanup-enabled: false

management:
  endpoint:
    health:
      show-details: never
