spring:
  config:
    activate:
      on-profile: test
  flyway:
    placeholders:
      data-encryption-key-base64: ${DATA_ENCRYPTION_KEY_BASE64:REDACTED_HISTORY_VALUE}
  jpa:
    show-sql: false

app:
  identity:
    email-verification:
      enabled: false
      provider: smtp
  security:
    data-encryption:
      key-base64: ${DATA_ENCRYPTION_KEY_BASE64:REDACTED_HISTORY_VALUE}
  ai:
    provider: openai
  rate-limit:
    enabled: false
  jobkorea:
    export-audit:
      retention-cleanup-enabled: false

management:
  endpoint:
    health:
      show-details: never
