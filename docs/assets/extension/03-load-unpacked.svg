<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Chrome에서 압축해제된 확장 프로그램 로드</title>
  <desc id="desc">chrome://extensions에서 개발자 모드와 압축해제된 확장 프로그램 로드를 선택하는 안내 그림</desc>
  <rect width="900" height="500" rx="24" fill="#f8fafc"/>
  <rect x="32" y="28" width="836" height="444" rx="18" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <rect x="32" y="28" width="836" height="58" rx="18" fill="#eef2ff"/>
  <rect x="70" y="43" width="560" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="92" y="64" fill="#334155" font-family="Arial, sans-serif" font-size="16">chrome://extensions</text>
  <text x="74" y="133" fill="#172033" font-family="Arial, sans-serif" font-size="26" font-weight="700">3. 확장 프로그램 로드</text>
  <rect x="74" y="168" width="752" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="100" y="211" fill="#334155" font-family="Arial, sans-serif" font-size="20" font-weight="700">개발자 모드</text>
  <rect x="710" y="186" width="76" height="34" rx="17" fill="#2563eb"/>
  <circle cx="768" cy="203" r="13" fill="#ffffff"/>
  <rect x="74" y="270" width="270" height="58" rx="10" fill="#2563eb"/>
  <text x="104" y="306" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">압축해제된 확장 프로그램을 로드</text>
  <path d="M380 299 L465 299" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M448 283 L468 299 L448 315" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="492" y="270" width="314" height="58" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="518" y="306" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="17" font-weight="700">extension 폴더 선택</text>
  <rect x="74" y="371" width="752" height="66" rx="10" fill="#fff7ed"/>
  <text x="98" y="399" fill="#9a3412" font-family="Arial, sans-serif" font-size="16">처음 설치할 때만 개발자 모드를 켭니다.</text>
  <text x="98" y="423" fill="#9a3412" font-family="Arial, sans-serif" font-size="16">새 버전은 다시 다운로드한 뒤 Reload가 필요합니다.</text>
</svg>
