<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Career Note production 서비스 연결</title>
  <desc id="desc">확장 프로그램에서 production 서비스 주소를 확인하고 연결 코드를 발급하는 안내 그림</desc>
  <rect width="900" height="500" rx="24" fill="#f8fafc"/>
  <rect x="32" y="28" width="836" height="444" rx="18" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text x="74" y="92" fill="#172033" font-family="Arial, sans-serif" font-size="26" font-weight="700">4. Career Note 서비스 연결</text>
  <rect x="74" y="130" width="752" height="76" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="100" y="160" fill="#64748b" font-family="Arial, sans-serif" font-size="14">서비스 주소</text>
  <text x="100" y="188" fill="#172033" font-family="Consolas, monospace" font-size="19">https://career-note-web-sg.onrender.com</text>
  <rect x="74" y="235" width="310" height="56" rx="10" fill="#172033"/>
  <text x="108" y="270" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">서비스에서 연결 코드 발급</text>
  <path d="M414 263 L492 263" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M475 247 L495 263 L475 279" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="528" y="235" width="276" height="56" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="558" y="270" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="17" font-weight="700">로그인 후 1회용 코드 발급</text>
  <rect x="74" y="331" width="730" height="70" rx="12" fill="#dcfce7"/>
  <text x="100" y="365" fill="#166534" font-family="Arial, sans-serif" font-size="17" font-weight="700">코드를 확장 프로그램에 입력 → 연결</text>
  <text x="100" y="389" fill="#166534" font-family="Arial, sans-serif" font-size="15">비밀번호·쿠키·Refresh Token은 확장 프로그램에 입력하지 않습니다.</text>
</svg>
