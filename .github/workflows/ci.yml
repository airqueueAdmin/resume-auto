name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: ai-career-platform

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Java
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '25.0.2'
          cache: maven

      - name: Run Maven tests
        run: ./mvnw -B test

  frontend-build:
    name: Frontend build and dependency report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24.8.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json || true

      - name: Upload frontend dependency report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: frontend-dependency-audit
          path: frontend/npm-audit.json
          if-no-files-found: warn

  compose-validate:
    name: Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Generate ephemeral Compose secrets
        shell: bash
        run: |
          generate_secret() {
            local name="$1"
            local value
            value="$(openssl rand -base64 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          }

          generate_secret JWT_SECRET_BASE64
          generate_secret DATA_ENCRYPTION_KEY_BASE64
          generate_secret EMAIL_VERIFICATION_HMAC_SECRET_BASE64

      - name: Validate Compose configuration
        run: docker compose config --quiet

  container-build-and-scan:
    name: Container builds and vulnerability reports
    needs:
      - backend-test
      - frontend-build
      - compose-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Generate ephemeral Compose secrets
        shell: bash
        run: |
          generate_secret() {
            local name="$1"
            local value
            value="$(openssl rand -base64 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          }

          generate_secret JWT_SECRET_BASE64
          generate_secret DATA_ENCRYPTION_KEY_BASE64
          generate_secret EMAIL_VERIFICATION_HMAC_SECRET_BASE64

      - name: Build backend and frontend images
        run: docker compose build backend frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ai-career-platform-backend
          format: table
          output: trivy-backend.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ai-career-platform-frontend
          format: table
          output: trivy-frontend.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload image vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: container-vulnerability-reports
          path: |
            trivy-backend.txt
            trivy-frontend.txt
          if-no-files-found: warn

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check dependency changes
        uses: actions/dependency-review-action@v4.6.0
        with:
          fail-on-severity: high
