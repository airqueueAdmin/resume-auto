services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-true}
      EMAIL_VERIFICATION_HMAC_SECRET_BASE64: ${EMAIL_VERIFICATION_HMAC_SECRET_BASE64:?Set EMAIL_VERIFICATION_HMAC_SECRET_BASE64 in .env.oracle}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME to the dedicated Gmail address in .env.oracle}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD to the Gmail app password in .env.oracle}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-false}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS to the same Gmail address in .env.oracle}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Career Note}
      EMAIL_VERIFICATION_RATE_LIMIT_ENABLED: ${EMAIL_VERIFICATION_RATE_LIMIT_ENABLED:-true}
      EMAIL_VERIFICATION_CLIENT_RATE_LIMIT_WINDOW: ${EMAIL_VERIFICATION_CLIENT_RATE_LIMIT_WINDOW:-PT1H}
      EMAIL_VERIFICATION_MAX_CLIENT_REQUESTS: ${EMAIL_VERIFICATION_MAX_CLIENT_REQUESTS:-20}
      EMAIL_VERIFICATION_DELIVERY_RATE_LIMIT_WINDOW: ${EMAIL_VERIFICATION_DELIVERY_RATE_LIMIT_WINDOW:-P1D}
      EMAIL_VERIFICATION_MAX_DELIVERIES: ${EMAIL_VERIFICATION_MAX_DELIVERIES:-400}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_RESUME_DRAFT_PROVIDER: ${AI_RESUME_DRAFT_PROVIDER:-gemini}
      AI_RESUME_DRAFT_OLLAMA_FALLBACK_ENABLED: ${AI_RESUME_DRAFT_OLLAMA_FALLBACK_ENABLED:-false}
      AI_SELF_INTRODUCTION_OLLAMA_FALLBACK_ENABLED: ${AI_SELF_INTRODUCTION_OLLAMA_FALLBACK_ENABLED:-false}
